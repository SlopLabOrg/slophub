name: Validate Slophub Packages

on:
  pull_request:
    paths:
      - ".github/workflows/validate-manifest.yml"
      - "manifests/**"
      - "scripts/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package manifests
        run: |
          set -euo pipefail

          python3 scripts/slophub.py resolve --output build/packages.json

      - name: Import bundles into test repository
        run: |
          set -euo pipefail

          mkdir -p build-test/downloads build-test/repo
          python3 scripts/slophub.py import-bundles \
            --input build/packages.json \
            --download-dir build-test/downloads \
            --repo-dir build-test/repo
