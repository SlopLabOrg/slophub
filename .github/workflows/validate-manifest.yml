name: Validate Slophub Packages

on:
  pull_request:
    paths:
      - ".github/workflows/validate-manifest.yml"
      - "manifests/**"
      - "scripts/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check cairosvg defusedxml

      - name: Resolve package manifests
        run: |
          set -euo pipefail

          python3 scripts/slophub.py resolve --output build/packages.json
