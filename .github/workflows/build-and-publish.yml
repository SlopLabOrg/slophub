name: Build and Publish Slophub

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-and-publish.yml"
      - "manifests/**"
      - "scripts/**"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slophub-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check cairosvg defusedxml

      - name: Validate configuration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOPHUB_GPG_KEY_ID: ${{ vars.SLOPHUB_GPG_KEY_ID }}
          SLOPHUB_GPG_PRIVATE_KEY: ${{ secrets.SLOPHUB_GPG_PRIVATE_KEY }}
          SLOPHUB_GPG_PASSPHRASE: ${{ secrets.SLOPHUB_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          required=(
            SLOPHUB_GPG_KEY_ID
            SLOPHUB_GPG_PRIVATE_KEY
            SLOPHUB_GPG_PASSPHRASE
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required configuration: ${name}" >&2
              exit 1
            fi
          done
          python3 scripts/slophub.py resolve --output build/packages.json

      - name: Import signing key
        env:
          SLOPHUB_GPG_KEY_ID: ${{ vars.SLOPHUB_GPG_KEY_ID }}
          SLOPHUB_GPG_PRIVATE_KEY: ${{ secrets.SLOPHUB_GPG_PRIVATE_KEY }}
          SLOPHUB_GPG_PASSPHRASE: ${{ secrets.SLOPHUB_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.gnupg"
          chmod 700 "${HOME}/.gnupg"
          printf 'allow-preset-passphrase\n' >> "${HOME}/.gnupg/gpg-agent.conf"

          printf '%s' "${SLOPHUB_GPG_PRIVATE_KEY}" > /tmp/slophub-private.key.asc
          gpg --batch --import /tmp/slophub-private.key.asc

          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent

          keygrips="$(
            gpg --batch --with-colons --with-keygrip --list-secret-keys "${SLOPHUB_GPG_KEY_ID}" \
              | awk -F: '$1 == "grp" { print $10 }'
          )"

          if [ -z "${keygrips}" ]; then
            echo "Could not resolve keygrips for ${SLOPHUB_GPG_KEY_ID}" >&2
            exit 1
          fi

          preset_passphrase="$(gpgconf --list-dirs libexecdir)/gpg-preset-passphrase"
          while IFS= read -r keygrip; do
            [ -n "${keygrip}" ] || continue
            "${preset_passphrase}" --preset --passphrase "${SLOPHUB_GPG_PASSPHRASE}" "${keygrip}"
          done <<EOF
          ${keygrips}
          EOF

      - name: Build Flatpak repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOPHUB_BRANCH: ${{ vars.SLOPHUB_BRANCH }}
          SLOPHUB_COLLECTION_ID: ${{ vars.SLOPHUB_COLLECTION_ID }}
          SLOPHUB_GPG_KEY_ID: ${{ vars.SLOPHUB_GPG_KEY_ID }}
        run: |
          set -euo pipefail

          mkdir -p build repo public downloads
          collection_flag=()
          if [ -n "${SLOPHUB_COLLECTION_ID:-}" ]; then
            collection_flag+=(--collection-id="${SLOPHUB_COLLECTION_ID}")
          fi

          python3 scripts/slophub.py resolve --output build/packages.json
          python3 scripts/slophub.py import-bundles \
            --input build/packages.json \
            --download-dir downloads \
            --repo-dir repo \
            --gpg-sign "${SLOPHUB_GPG_KEY_ID}"

          flatpak build-update-repo \
            repo \
            --gpg-sign="${SLOPHUB_GPG_KEY_ID}" \
            --no-update-appstream \
            --prune \
            "${collection_flag[@]}"

      - name: Render repository metadata
        env:
          SLOPHUB_FLATPAKREPO_URL: ${{ vars.SLOPHUB_FLATPAKREPO_URL }}
          SLOPHUB_BRANCH: ${{ vars.SLOPHUB_BRANCH }}
          SLOPHUB_COLLECTION_ID: ${{ vars.SLOPHUB_COLLECTION_ID }}
          SLOPHUB_ICON_URL: ${{ vars.SLOPHUB_ICON_URL }}
          SLOPHUB_REMOTE_NAME: ${{ vars.SLOPHUB_REMOTE_NAME || 'slophub' }}
          SLOPHUB_REPO_COMMENT: ${{ vars.SLOPHUB_REPO_COMMENT }}
          SLOPHUB_REPO_DESCRIPTION: ${{ vars.SLOPHUB_REPO_DESCRIPTION }}
          SLOPHUB_REPO_HOMEPAGE: ${{ vars.SLOPHUB_REPO_HOMEPAGE }}
          SLOPHUB_REPOSITORY_WEB_URL: ${{ vars.SLOPHUB_REPOSITORY_WEB_URL }}
          SLOPHUB_REPO_URL: ${{ vars.SLOPHUB_REPO_URL }}
          SLOPHUB_REPO_TITLE: ${{ vars.SLOPHUB_REPO_TITLE || 'Slophub' }}
          SLOPHUB_RUNTIME_REPO: ${{ vars.SLOPHUB_RUNTIME_REPO || 'https://dl.flathub.org/repo/flathub.flatpakrepo' }}
          SLOPHUB_GPG_KEY_ID: ${{ vars.SLOPHUB_GPG_KEY_ID }}
        run: |
          set -euo pipefail

          gpg --batch --yes --output public/slophub-signing-key.gpg --export "${SLOPHUB_GPG_KEY_ID}"
          export SLOPHUB_GPG_KEY_BASE64="$(base64 -w0 public/slophub-signing-key.gpg)"
          python3 scripts/slophub.py render-metadata --input build/packages.json --public-dir public
          cp -R repo/. public/repo/

      - name: Check publish size
        run: |
          set -euo pipefail

          du -sh public
          du -sh public/* | sort -rh
          du -sh public/repo/* | sort -rh | head -30

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slophub-pages
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: slophub-pages
          path: public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
