name: Build and Publish Slophub

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-and-publish.yml"
      - "manifests/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slophub-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        env:
          SLOPHUB_APP_ID: ${{ vars.SLOPHUB_APP_ID }}
          SLOPHUB_MANIFEST_PATH: ${{ vars.SLOPHUB_MANIFEST_PATH }}
          SLOPHUB_GPG_KEY_ID: ${{ vars.SLOPHUB_GPG_KEY_ID }}
          SLOPHUB_GPG_PRIVATE_KEY: ${{ secrets.SLOPHUB_GPG_PRIVATE_KEY }}
          SLOPHUB_GPG_PASSPHRASE: ${{ secrets.SLOPHUB_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          required=(
            SLOPHUB_APP_ID
            SLOPHUB_MANIFEST_PATH
            SLOPHUB_GPG_KEY_ID
            SLOPHUB_GPG_PRIVATE_KEY
            SLOPHUB_GPG_PASSPHRASE
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required configuration: ${name}" >&2
              exit 1
            fi
          done

          if [ ! -f "${SLOPHUB_MANIFEST_PATH}" ]; then
            echo "Manifest not found: ${SLOPHUB_MANIFEST_PATH}" >&2
            exit 1
          fi

      - name: Import signing key
        env:
          SLOPHUB_GPG_KEY_ID: ${{ vars.SLOPHUB_GPG_KEY_ID }}
          SLOPHUB_GPG_PRIVATE_KEY: ${{ secrets.SLOPHUB_GPG_PRIVATE_KEY }}
          SLOPHUB_GPG_PASSPHRASE: ${{ secrets.SLOPHUB_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.gnupg"
          chmod 700 "${HOME}/.gnupg"
          printf 'allow-preset-passphrase\n' >> "${HOME}/.gnupg/gpg-agent.conf"

          printf '%s' "${SLOPHUB_GPG_PRIVATE_KEY}" > /tmp/slophub-private.key.asc
          gpg --batch --import /tmp/slophub-private.key.asc

          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent

          keygrip="$(
            gpg --batch --with-colons --with-keygrip --list-secret-keys "${SLOPHUB_GPG_KEY_ID}" \
              | awk -F: '$1 == "grp" { print $10; exit }'
          )"

          if [ -z "${keygrip}" ]; then
            echo "Could not resolve keygrip for ${SLOPHUB_GPG_KEY_ID}" >&2
            exit 1
          fi

          preset_passphrase="$(gpgconf --list-dirs libexecdir)/gpg-preset-passphrase"
          "${preset_passphrase}" --preset --passphrase "${SLOPHUB_GPG_PASSPHRASE}" "${keygrip}"

      - name: Build Flatpak repository
        env:
          SLOPHUB_APP_ID: ${{ vars.SLOPHUB_APP_ID }}
          SLOPHUB_MANIFEST_PATH: ${{ vars.SLOPHUB_MANIFEST_PATH }}
          SLOPHUB_BRANCH: ${{ vars.SLOPHUB_BRANCH }}
          SLOPHUB_COLLECTION_ID: ${{ vars.SLOPHUB_COLLECTION_ID }}
          SLOPHUB_GPG_KEY_ID: ${{ vars.SLOPHUB_GPG_KEY_ID }}
        run: |
          set -euo pipefail

          mkdir -p build repo public
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

          branch_flag=()
          collection_flag=()
          if [ -n "${SLOPHUB_BRANCH:-}" ]; then
            branch_flag+=(--default-branch="${SLOPHUB_BRANCH}")
          fi
          if [ -n "${SLOPHUB_COLLECTION_ID:-}" ]; then
            collection_flag+=(--collection-id="${SLOPHUB_COLLECTION_ID}")
          fi

          flatpak-builder \
            --force-clean \
            --repo=repo \
            --gpg-sign="${SLOPHUB_GPG_KEY_ID}" \
            --install-deps-from=flathub \
            "${branch_flag[@]}" \
            "${collection_flag[@]}" \
            build \
            "${SLOPHUB_MANIFEST_PATH}"

          flatpak build-update-repo \
            repo \
            --gpg-sign="${SLOPHUB_GPG_KEY_ID}" \
            --generate-static-deltas \
            --prune \
            "${collection_flag[@]}"

      - name: Render repository metadata
        env:
          SLOPHUB_APP_ID: ${{ vars.SLOPHUB_APP_ID }}
          SLOPHUB_BRANCH: ${{ vars.SLOPHUB_BRANCH }}
          SLOPHUB_COLLECTION_ID: ${{ vars.SLOPHUB_COLLECTION_ID }}
          SLOPHUB_DESCRIPTION: ${{ vars.SLOPHUB_DESCRIPTION }}
          SLOPHUB_ICON_URL: ${{ vars.SLOPHUB_ICON_URL }}
          SLOPHUB_REMOTE_NAME: ${{ vars.SLOPHUB_REMOTE_NAME }}
          SLOPHUB_REPO_COMMENT: ${{ vars.SLOPHUB_REPO_COMMENT }}
          SLOPHUB_REPO_DESCRIPTION: ${{ vars.SLOPHUB_REPO_DESCRIPTION }}
          SLOPHUB_REPO_HOMEPAGE: ${{ vars.SLOPHUB_REPO_HOMEPAGE }}
          SLOPHUB_REPO_TITLE: ${{ vars.SLOPHUB_REPO_TITLE }}
          SLOPHUB_RUNTIME_REPO: ${{ vars.SLOPHUB_RUNTIME_REPO }}
          SLOPHUB_GPG_KEY_ID: ${{ vars.SLOPHUB_GPG_KEY_ID }}
        run: |
          set -euo pipefail

          gpg --batch --yes --output public/slophub-signing-key.gpg --export "${SLOPHUB_GPG_KEY_ID}"
          export SLOPHUB_GPG_KEY_BASE64="$(base64 -w0 public/slophub-signing-key.gpg)"
          ./scripts/render-flatpak-metadata.sh
          cp -R repo/. public/repo/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slophub-pages
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: slophub-pages
          path: public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
